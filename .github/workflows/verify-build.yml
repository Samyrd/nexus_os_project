# ═══════════════════════════════════════════════════════════════════════════════
# Nexus OS — Verify Build Pipeline
# Triggers on every Pull Request to ensure code compiles and infrastructure
# configuration is valid before merge.
# ═══════════════════════════════════════════════════════════════════════════════

name: "🔍 Verify Build"

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  # ─── Job 1: Build Java Backend ──────────────────────────────────────────────
  build-backend:
    name: "☕ Build Backend (Java ${{ env.JAVA_VERSION }} + Maven)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"

      - name: 📦 Build with Maven
        run: |
          chmod +x mvnw 2>/dev/null || true
          ./mvnw clean verify -B -DskipTests=false \
            -Dmaven.javadoc.skip=true \
            -Dspring.profiles.active=test
        env:
          CI: true

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ─── Job 2: Build Next.js Frontend ──────────────────────────────────────────
  build-frontend:
    name: "⚛️ Build Frontend (Next.js + Node ${{ env.NODE_VERSION }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint
        continue-on-error: true

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

  # ─── Job 3: Validate Docker Compose ─────────────────────────────────────────
  validate-docker:
    name: "🐳 Validate docker-compose.yml"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Validate Docker Compose syntax
        run: |
          echo "── Validating docker-compose.yml ──"
          docker compose -f docker-compose.yml config --quiet
          echo "✅ docker-compose.yml is valid"

      - name: 📋 Print resolved config
        run: |
          echo "── Resolved Docker Compose configuration ──"
          docker compose -f docker-compose.yml config

  # ─── Job 4: Summary Gate ────────────────────────────────────────────────────
  build-gate:
    name: "🚦 Build Gate"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, validate-docker]
    if: always()

    steps:
      - name: 🚦 Check all jobs passed
        run: |
          echo "Backend:  ${{ needs.build-backend.result }}"
          echo "Frontend: ${{ needs.build-frontend.result }}"
          echo "Docker:   ${{ needs.validate-docker.result }}"

          if [[ "${{ needs.build-backend.result }}" != "success" ]] || \
             [[ "${{ needs.build-frontend.result }}" != "success" ]] || \
             [[ "${{ needs.validate-docker.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed. Blocking merge."
            exit 1
          fi

          echo "✅ All verification checks passed. Ready to merge."
