# ═══════════════════════════════════════════════════════════════════════════════
# Nexus OS — Application Configuration
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: nexus-os

  # ── Virtual Threads (Project Loom) ──────────────────────────────────────────
  threads:
    virtual:
      enabled: true

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_os
    username: nexus
    password: nexus_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: nexus-os-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ── Temporal ────────────────────────────────────────────────────────────────
temporal:
  service-address: localhost:7233
  namespace: nexus-os
  task-queue: nexus-agent-queue

# ── Qdrant ──────────────────────────────────────────────────────────────────
qdrant:
  host: localhost
  port: 6334
  collection-name: nexus-memory

# ── LangChain4j ─────────────────────────────────────────────────────────────
langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY:sk-placeholder}
    model-name: gpt-4o
    temperature: 0.2
    max-tokens: 2048

# ── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: 8081
